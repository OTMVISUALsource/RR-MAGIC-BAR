<meta name="apple-mobile-web-app-title" content="RR Magic Bar"><meta name="application-name" content="RR Magic Bar">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Creepster&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f9;--card:#fff;--ink:#2b1a24;--mut:#8a6f7e;--pink:#f6709f;--deep:#e0407c;--lav:#c59ddf;--line:#f6c9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1118;--card:#2a1a24;--ink:#fff0f6;--mut:#c9a9ba;--line:#4a2d3d}}
:root[data-theme="dark"]{--bg:#1c1118;--card:#2a1a24;--ink:#fff0f6;--mut:#c9a9ba;--line:#4a2d3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 Poppins,system-ui,sans-serif;overflow-x:hidden}
.screen{display:none;flex-direction:column;align-items:center;min-height:100%;padding:16px;max-width:980px;margin:0 auto;gap:14px}
.screen.on{display:flex}
h1,h2{font-family:Pacifico,cursive;font-weight:400;margin:0;color:var(--deep)}
h1{font-size:clamp(34px,8vw,56px)}h2{font-size:28px}
p{margin:0;color:var(--mut)}
button{font:600 16px Poppins,system-ui,sans-serif;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:var(--card);color:var(--deep);border:2px solid var(--line)}
button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.big{background:linear-gradient(135deg,#ff7eb3,#e0407c);color:#fff;border:0;font-size:19px;padding:16px 38px;box-shadow:0 8px 22px #e0407c55}
.logo{width:min(78vw,460px);max-height:36vh;object-fit:contain;filter:drop-shadow(0 6px 14px #e0407c33)}
.home{justify-content:center;text-align:center;gap:18px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar button{padding:10px 18px}
.seg,.tabs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px}
.seg button,.tabs button{white-space:nowrap;padding:10px 16px;font-size:14px}
.seg button.sel,.tabs button.sel{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:600}
.tile.sel{border-color:var(--deep);box-shadow:0 6px 18px #e0407c44}
.tile canvas{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:6px}
.sticky{position:sticky;bottom:12px;margin-top:auto}
#vf{position:relative;width:100%;max-width:min(720px,100%,max(240px,calc((100dvh - 440px)*4/3)));aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#000;border:4px solid var(--pink)}
#vf video{width:100%;height:100%;object-fit:cover;display:block}
#vf video{transform-origin:0 0}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 min(30vw,180px) Pacifico,cursive;color:#fff;text-shadow:0 4px 24px #e0407c}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#nocam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:#3a2330;font-size:14px}
[hidden]{display:none!important}
.slots{display:flex;gap:8px;justify-content:center}
.slots canvas{width:68px;height:51px;border-radius:8px;background:var(--line);border:2px solid var(--line)}
.ctl{display:flex;align-items:center;gap:22px}
.shut{width:78px;height:78px;border-radius:50%;padding:0;background:#fff;border:6px solid var(--pink);box-shadow:0 0 0 4px var(--deep)}
#res img{max-width:100%;max-height:58dvh;border-radius:12px;box-shadow:0 10px 30px #0003;background:#fff}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.acts button{padding:14px 6px;font-size:14px}
.acts .big{font-size:14px;padding:14px 6px;box-shadow:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#vf{z-index:6;transition:box-shadow .4s}
#vf.lit{box-shadow:0 0 0 7px #fff,0 0 50px 18px #fff,0 0 110px 45px #ff9ac8}
#cam>*{position:relative;z-index:6}
#ring{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;z-index:5;background:radial-gradient(ellipse farthest-corner at 50% 50%,rgba(255,255,255,0) 38%,rgba(255,255,255,.75) 58%,#fff 72%,#ffe3f1 100%)}
#ring.on{opacity:1}
body.ringon #cam p{color:#7a3556}
#tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0}
#vf.f-bw video{filter:grayscale(1) contrast(1.12)}
#vf.f-rainbow video{filter:saturate(1.35) contrast(1.05)}
#vf.f-pink video{filter:saturate(1.2) brightness(1.08) contrast(.96) sepia(.18) hue-rotate(-14deg)}
#vf.f-rainbow #tint{opacity:.7;background:linear-gradient(120deg,#ff3b3b,#ffb02e,#fff23a,#3be86b,#32b8ff,#8a5bff,#ff4fd8)}
#vf.f-pink #tint{opacity:.55;background:linear-gradient(#ff9ac8,#ffc2de)}
#msg{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;background:linear-gradient(135deg,#ff7eb3,#e0407c);color:#fff;font:400 clamp(20px,5.5vw,36px) Pacifico,cursive;padding:8px 22px;border-radius:999px;box-shadow:0 6px 20px #0005}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#msg{animation-fill-mode:both}
#pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#nocam p{color:#ffd9e8;margin:8px 0 14px;font-size:14px}#nocam p:last-child{margin-bottom:0}
.screen{padding-top:58px}
#lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:20;display:flex;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
#lang button{padding:6px 12px;font-size:13px;border:0;background:transparent}#lang button.sel{background:var(--pink);color:#fff}
#props{width:100%;max-width:720px;text-align:center;background:linear-gradient(135deg,#3a0f2a,#1f0a2e);border:2px solid #ff5fa2;border-radius:18px;padding:10px 12px;animation:box 2.2s ease-in-out infinite}
#props .glow{font:700 clamp(13px,3.6vw,20px)/1.25 Poppins,sans-serif;color:#fff;animation:glow 1.6s ease-in-out infinite}
#props small{display:block;color:#ffc4de;margin-top:4px;font-size:12px}
@keyframes glow{0%,100%{text-shadow:0 0 5px #fff,0 0 14px #ff4d8d,0 0 28px #ff4d8d}50%{text-shadow:0 0 8px #fff,0 0 22px #ff2f7d,0 0 46px #c059ff;color:#ffe6f2}}
@keyframes box{0%,100%{box-shadow:0 0 10px #ff5fa2aa}50%{box-shadow:0 0 26px #ff5fa2,0 0 40px #c059ff88}}
#cd.brk{font-size:min(16vw,90px);color:#f3e5ff;text-shadow:0 2px 16px #9b6bd6}

$('#zm').onclick=e=>{const z=+e.target.dataset.z;if(!z||S.busy)return;Z.z=z;if(z==1){Z.tx=Z.ty=.5}[...$('#zm').children].forEach(b=>b.classList.toggle('sel',+b.dataset.z==z))};
$('#mir').onclick=e=>{const v=e.target.dataset.mi;if(v==null||S.busy||S.live)return;S.mirror=v=='1';[...$('#mir').children].forEach(b=>b.classList.toggle('sel',b.dataset.mi==v))};
$('#mode').onclick=e=>{const m=e.target.dataset.m;if(!m||S.busy||S.live)return;S.mode=m;[...$('#mode').children].forEach(b=>b.classList.toggle('sel',b.dataset.m==m));$('#hint').textContent=hintTxt()};
async function snap(i){const fl=$('#fl');fl.style.transition="none";fl.style.opacity=1;await sleep(40);fl.style.transition="opacity .35s";fl.style.opacity=0;S.photos.push(grab());slots();await preview(i)}
function finish(){ring(false);S.busy=S.live=false;$('#hint').textContent=hintTxt();showResult()}
async function shoot(){
 if(!S.stream){startCam();return}
 if(S.mode=="manual"){if(S.snapping||S.busy)return;S.snapping=true;const run=S.run;
  if(!S.live){S.live=true;ring(true);S.photos=[];slots()}
  await snap(S.photos.length);S.snapping=false;if(run!=S.run)return;
  if(S.photos.length>=S.n)finish();else $('#hint').textContent=`${tr('photo')} ${S.photos.length+1} ${tr('of')} ${S.n}`;return}
 if(S.busy)return;S.busy=true;ring(true);S.photos=[];slots();const run=++S.run;
 for(let i=0;i<S.n;i++){$('#hint').textContent=tr('ready');await countdown(6,true);if(run!=S.run)return;
  $('#hint').textContent=`${tr('photo')} ${i+1} ${tr('of')} ${S.n}`;await countdown(5);if(run!=S.run)return;await snap(i);if(run!=S.run)return}
 finish()}
$('#shut').onclick=shoot;$('#vf').onclick=()=>{if(S.mode=="manual")shoot()};
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 const im=new Image();im.onload=()=>{let sw=im.naturalWidth,sh=sw*3/4;if(sh>im.naturalHeight){sh=im.naturalHeight;sw=sh*4/3}
  const cw=Math.round(Math.min(sw,2400)),c=document.createElement('canvas');c.width=cw;c.height=Math.round(cw*3/4);
  c.getContext('2d').drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,0,0,c.width,c.height);
  S.photos.push(applyFilter(c,S.filter));slots();if(S.photos.length>=S.n)showResult();else toast(`Photo ${S.photos.length} saved. ${S.n-S.photos.length} to go!`)};
 im.src=URL.createObjectURL(f)};

async function preview(i){const pv=$('#pv'),m=$('#msg');pv.width=960;pv.height=720;pv.getContext('2d').drawImage(S.photos[i],0,0,960,720);
 pv.hidden=false;pv.style.animation='none';void pv.offsetWidth;pv.style.animation='pop .45s ease-out';
 m.textContent=`${tr('photo')} ${i+1} ${tr('of')} ${S.n}`;m.style.top='auto';m.style.bottom='5%';m.hidden=false;m.style.animation='none';
 await sleep(S.mode=='manual'?800:i<S.n-1?1800:900);pv.hidden=true;m.hidden=true}
// ---------- ring light, countdown, filters ----------
const MSG=["m1","m2","m3"],PREP=["p1","p2","p3","p4","p5"];let lastP=-1;let lastM=-1;
function ring(on){$('#ring').classList.toggle('on',on);$('#vf').classList.toggle('lit',on);document.body.classList.toggle('ringon',on)}
async function countdown(k0=5,prep){const cd=$('#cd'),m=$('#msg'),ph=$('#phase'),list=prep?PREP:MSG;
 ph.textContent=tr(prep?'phase1':'phase2');ph.classList.toggle('brk',!!prep);ph.hidden=false;
 for(let k=k0;k>0;k--){cd.textContent=k;cd.classList.toggle('brk',!!prep);m.classList.toggle('brk',!!prep);cd.hidden=false;cd.style.animation='none';void cd.offsetWidth;cd.style.animation='pop .9s ease-out';
  let j;do{j=Math.floor(Math.random()*list.length)}while(j==(prep?lastP:lastM));if(prep)lastP=j;else lastM=j;
  const top=Math.random()<.5;m.textContent=tr(list[j]);m.hidden=false;m.style.top=top?'16%':'auto';m.style.bottom=top?'auto':'5%';
  m.style.animation='none';void m.offsetWidth;m.style.animation='pop .7s ease-out';await sleep(1000)}
 cd.hidden=true;m.hidden=true;ph.hidden=true}
function setF(f){S.filter=f;const vf=$('#vf');vf.classList.remove('f-bw','f-rainbow','f-pink');if(f!="none")vf.classList.add('f-'+f);[...$('#flt').children].forEach(b=>b.classList.toggle('sel',b.dataset.f==f))}
$('#flt').onclick=e=>{const f=e.target.dataset.f;if(f&&!S.busy)setF(f)};
function applyFilter(cv,f){if(f=="none")return cv;const x=cv.getContext('2d'),w=cv.width,h=cv.height;
 const d=x.getImageData(0,0,w,h),p=d.data;
 for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2];const y=r*.3+g*.59+b*.11;
  if(f=="bw"){r=g=b=(y-128)*1.12+128}
  else if(f=="pink"){r=(r*1.06+14)*.84+41;g=(g*.97+6)*.84+27;b=(b*1.02+16)*.84+33}
  else{r=y+(r-y)*1.35;g=y+(g-y)*1.35;b=y+(b-y)*1.35}
  p[i]=r;p[i+1]=g;p[i+2]=b}
 x.putImageData(d,0,0);
 if(f!="bw"){let g2=x.createLinearGradient(0,0,w,h);
  (f=="rainbow"?["#ff3b3b","#ffb02e","#fff23a","#3be86b","#32b8ff","#8a5bff","#ff4fd8"]:["#ff9ac8","#ffc2de"]).forEach((c,i,a)=>g2.addColorStop(i/(a.length-1),c));
  x.globalCompositeOperation="soft-light";x.globalAlpha=f=="rainbow"?.7:.5;x.fillStyle=g2;x.fillRect(0,0,w,h);x.globalCompositeOperation="source-over";x.globalAlpha=1}
 return cv}
// ---------- result ----------
async function showResult(){go('res');try{await Promise.all([document.fonts.load('60px Pacifico'),document.fonts.load('60px Creepster')])}catch(e){}
 const cv=render(T[S.t],S.photos,S.n,maxScale(S.n));
 cv.toBlob(b=>{S.blob=b;$('#out').src=URL.createObjectURL(b)},'image/png')}
const file=()=>new File([S.blob],"RR-Magic-Bar.png",{type:"image/png"});
function save(){const a=document.createElement('a');a.href=URL.createObjectURL(S.blob);a.download="RR-Magic-Bar.png";document.body.append(a);a.click();a.remove();toast(tr('saved'))}
async function share(){if(!S.blob)return;const f=file();
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"RR Magic Bar",text:"Our RR Magic Bar photos!"});return true}catch(e){return e.name=="AbortError"}}
 return false}
$('#save').onclick=save;
$('#share').onclick=async()=>{if(!(await share())){save();toast(tr('noshare'))}};
$('#mail').onclick=async()=>{if(!(await share())){save();location.href="mailto:?subject="+encodeURIComponent(tr('subj'))+"&body="+encodeURIComponent(tr('body'))}};
$('#retake').onclick=()=>{S.photos=[];go('cam')};
$('#restyle').onclick=()=>{go('sty');drawTabs();drawGrid()};
$('#done').onclick=()=>{S.photos=[];go('home')};
try{lang=localStorage.getItem('rrl')||(navigator.language||'en').slice(0,2)}catch(e){}
$('#lang').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.l)setLang(b.dataset.l)};
setLang(lang=='es'?'es':'en');
// ---------- kiosk lock (triple-tap RR logo, top right) ----------
const K={locked:false,pin:"",taps:0,t:0,wl:null,mode:"lock"};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
$('#hot').src=document.querySelector('.logo').src;
function fs(){try{const d=document.documentElement,r=d.requestFullscreen||d.webkitRequestFullscreen;if(r){const p=r.call(d);if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
async function lockOn(){K.locked=true;document.body.classList.add('locked');document.documentElement.style.overscrollBehavior='none';$('#hot').classList.add('on');fs();
 try{if(navigator.wakeLock)K.wl=await navigator.wakeLock.request('screen')}catch(e){}
 try{for(let i=0;i<10;i++)history.pushState({k:i},'')}catch(e){}}
function lockOff(){K.locked=false;document.body.classList.remove('locked');document.documentElement.style.overscrollBehavior='';$('#hot').classList.remove('on');
 try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}
 try{if(K.wl){K.wl.release();K.wl=null}}catch(e){}}
function pinOpen(m){K.mode=m;$('#pt').textContent=tr(m+'T');$('#pd').textContent=tr(m+'D');$('#pg').textContent=m=='lock'?tr('lockTip'):'';$('#po').textContent=tr(m+'B');$('#pi').value='';$('#pe').textContent='';$('#pinm').hidden=false;setTimeout(()=>$('#pi').focus(),50)}
function doUnlock(){ls('rr_lock',null);$('#pinm').hidden=true;lockOff();toast(tr('unlockedT'))}
$('#hot').onclick=()=>{const n=Date.now();K.taps=n-K.t<900?K.taps+1:1;K.t=n;if(K.taps>=3){K.taps=0;if(K.locked){K.pin?pinOpen('unlock'):doUnlock()}else pinOpen('lock')}};
$('#pc').onclick=()=>{$('#pinm').hidden=true};
$('#pi').onkeydown=e=>{if(e.key=='Enter')$('#po').click()};
$('#pi').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'')};
$('#po').onclick=()=>{const v=$('#pi').value;
 if(K.mode=='lock'){if(v&&v.length!=4){$('#pe').textContent=tr('pin4');return}K.pin=v;ls('rr_pin',v||null);ls('rr_lock','1');$('#pinm').hidden=true;lockOn();toast(tr('lockedT'))}
 else{if(v==K.pin)doUnlock();else{$('#pe').textContent=tr('wrong');$('#pi').value=''}}};
addEventListener('popstate',()=>{if(K.locked){try{history.pushState({k:1},'')}catch(e){}}});
addEventListener('beforeunload',e=>{if(K.locked){e.preventDefault();e.returnValue=''}});
addEventListener('pointerdown',()=>{if(K.locked&&!document.fullscreenElement&&!document.webkitFullscreenElement)fs()},true);
addEventListener('contextmenu',e=>{if(K.locked&&e.target.id!='out')e.preventDefault()});
addEventListener('gesturestart',e=>{if(K.locked)e.preventDefault()});
addEventListener('dblclick',e=>{if(K.locked)e.preventDefault()});
addEventListener('touchmove',e=>{if(K.locked&&e.touches.length>1)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if(K.locked&&(e.ctrlKey||e.metaKey||e.key=='F5'||e.key=='F11'))e.preventDefault()});
document.addEventListener('visibilitychange',async()=>{if(K.locked&&document.visibilityState=='visible'){try{if(navigator.wakeLock)K.wl=await navigator.wakeLock.request('screen')}catch(e){}}});
let lastAct=Date.now(),hid=0;
function resetSession(){S.photos=[];S.blob=null;$('#out').removeAttribute('src');go('home')}
addEventListener('pointerdown',()=>{lastAct=Date.now()},true);
setInterval(()=>{if(K.locked&&!S.busy&&!S.live&&Date.now()-lastAct>120000&&($('#res').classList.contains('on')||$('#cam').classList.contains('on')))resetSession()},5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden')hid=Date.now();else if(K.locked&&hid&&Date.now()-hid>3000&&!S.busy&&!S.live&&!$('#home').classList.contains('on'))resetSession()});
K.pin=ls('rr_pin')||'';if(ls('rr_lock')=='1')lockOn();
</script></body></html>
